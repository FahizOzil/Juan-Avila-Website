name: Deploy Laravel to StackCP via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        timeout: 300s
        command_timeout: 120s
        script: |
          # Try to find the correct directory
          if [ -d "$HOME/public_html" ]; then
            cd "$HOME/public_html"
          elif [ -d "$HOME/authorjuanavila.com/public_html" ]; then
            cd "$HOME/authorjuanavila.com/public_html"
          elif [ -d "$HOME/www" ]; then
            cd "$HOME/www"
          elif [ -d "$HOME/htdocs" ]; then
            cd "$HOME/htdocs"
          else
            echo "Web directory not found. Creating $HOME/public_html"
            mkdir -p "$HOME/public_html"
            cd "$HOME/public_html"
          fi

          echo "Current directory: $(pwd)"

          # Initialize git if needed
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://github.com/${{ github.repository }}.git
            git fetch origin main
            git checkout -b main origin/main
          fi

          # Update code
          git pull origin main || echo "Using existing code"

          # Install dependencies
          composer install --no-dev --optimize-autoloader --no-interaction || {
            echo "Composer install failed, trying with php composer.phar"
            php composer.phar install --no-dev --optimize-autoloader --no-interaction
          }

          # Laravel commands
          php artisan migrate --force --no-interaction
          php artisan config:cache
          php artisan route:cache
