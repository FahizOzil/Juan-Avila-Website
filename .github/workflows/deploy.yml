name: Deploy Laravel to StackCP

on:
  push:
    branches: [ main ]  # Change to your default branch name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'  # Change to your PHP version
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql

    - name: Setup Node.js (for frontend assets)
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Composer dependencies
      run: composer install --optimize-autoloader --no-dev

    - name: Install NPM dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.3
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/  # Change to your StackCP public directory
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/.env
          **/.env.example
          **/README.md
          **/package.json
          **/package-lock.json
          **/webpack.mix.js
          **/composer.json
          **/composer.lock
          **/phpunit.xml
